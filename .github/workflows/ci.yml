name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, types, tests (React 19)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Committed dist matches a fresh build
        run: git diff --exit-code -- dist
      - run: node test/compat.cjs
      - run: npm run build-example
      # GitHub Pages serves the committed demo/, so it must match the source.
      # git status also catches new hashed asset files, which git diff misses.
      - name: Committed demo matches a fresh build
        run: |
          git status --porcelain -- demo
          test -z "$(git status --porcelain -- demo)"
      - name: Package contents
        run: npm pack --dry-run

  react-versions:
    name: React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: [15, 16, 17, 18]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --legacy-peer-deps react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - name: Same markup as React 19, no warnings
        run: node test/compat.cjs
      - name: Full test suite
        if: matrix.react == 18
        run: npm test
